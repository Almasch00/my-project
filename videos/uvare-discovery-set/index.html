<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Uvaré — The Discovery Set</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Jost";
        src: url("assets/fonts/jost-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f2f1ee;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f2f1ee;
      }
      .shot {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .shot .inner {
        position: absolute;
        inset: 0;
      }
      .shot video {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      #endcard {
        position: absolute;
        inset: 0;
        background: #f2f1ee;
        opacity: 0;
      }
      #end-stack {
        position: absolute;
        left: 0;
        right: 0;
        top: 800px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
      }
      #end-logo {
        width: 560px;
        height: auto;
        display: block;
      }
      #end-label {
        font-family: "Jost", sans-serif;
        font-weight: 400;
        font-size: 26px;
        letter-spacing: 0.5em;
        text-transform: uppercase;
        color: #1a1a1a;
      }
    </style>
  </head>
  <body>
    <!-- Cut to a 110 BPM groove (beat = 0.5455s): 11 hard cuts on the beat, logo on bar 8. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="18"
      data-width="1080"
      data-height="1920"
    >
      <!-- start / duration / media-start in seconds; see SHOTS in the script for beat counts -->
      <div class="shot" id="s1"><div class="inner" data-layout-allow-overflow>
        <video id="v1" src="footage/img_1176.mp4" data-start="0" data-duration="1.636" data-media-start="0.2" data-track-index="0" muted playsinline></video>
      </div></div>
      <div class="shot" id="s2"><div class="inner" data-layout-allow-overflow>
        <video id="v2" src="footage/img_1176.mp4" data-start="1.636" data-duration="1.091" data-media-start="1.9" data-track-index="1" muted playsinline></video>
      </div></div>
      <div class="shot" id="s3"><div class="inner" data-layout-allow-overflow>
        <video id="v3" src="footage/img_1209.mp4" data-start="2.727" data-duration="1.091" data-media-start="0" data-track-index="0" muted playsinline></video>
      </div></div>
      <div class="shot" id="s4"><div class="inner" data-layout-allow-overflow>
        <video id="v4" src="footage/img_1209.mp4" data-start="3.818" data-duration="1.636" data-media-start="1.6" data-track-index="1" muted playsinline></video>
      </div></div>
      <div class="shot" id="s5"><div class="inner" data-layout-allow-overflow>
        <video id="v5" src="footage/img_1208.mp4" data-start="5.455" data-duration="1.636" data-media-start="0.3" data-track-index="0" muted playsinline></video>
      </div></div>
      <div class="shot" id="s6"><div class="inner" data-layout-allow-overflow>
        <video id="v6" src="footage/img_1208.mp4" data-start="7.091" data-duration="1.091" data-media-start="1.9" data-track-index="1" muted playsinline></video>
      </div></div>
      <div class="shot" id="s7"><div class="inner" data-layout-allow-overflow>
        <video id="v7" src="footage/img_1179.mp4" data-start="8.182" data-duration="1.636" data-media-start="0.3" data-track-index="0" muted playsinline></video>
      </div></div>
      <div class="shot" id="s8"><div class="inner" data-layout-allow-overflow>
        <video id="v8" src="footage/img_1179.mp4" data-start="9.818" data-duration="1.091" data-media-start="2.2" data-track-index="1" muted playsinline></video>
      </div></div>
      <div class="shot" id="s9"><div class="inner" data-layout-allow-overflow>
        <video id="v9" src="footage/img_1205.mp4" data-start="10.909" data-duration="1.636" data-media-start="1.8" data-track-index="0" muted playsinline></video>
      </div></div>
      <div class="shot" id="s10"><div class="inner" data-layout-allow-overflow>
        <video id="v10" src="footage/img_1205.mp4" data-start="12.545" data-duration="1.091" data-media-start="3.3" data-track-index="1" muted playsinline></video>
      </div></div>
      <div class="shot" id="s11"><div class="inner" data-layout-allow-overflow>
        <video id="v11" src="footage/img_1176.mp4" data-start="13.636" data-duration="1.636" data-media-start="1.4" data-track-index="0" muted playsinline></video>
      </div></div>

      <div id="endcard">
        <div id="end-stack">
          <img id="end-logo" src="assets/uvare-logo-original.png" alt="Uvaré" />
          <div id="end-label">The Discovery Set</div>
        </div>
      </div>

      <audio id="music" src="assets/music.wav" data-start="0" data-duration="18" data-track-index="3" data-volume="0.9"></audio>
    </div>

    <script>
      const BEAT = 60 / 110;
      const tl = gsap.timeline({ paused: true });

      // Framing per shot: close punch-ins and slight tilts like the reference's handheld close-ups.
      // origin = focus point, s0 -> s1 = slow drift in scale, r = tilt (deg).
      const SHOTS = [
        { id: "#s1", beats: 3, origin: "50% 45%", s0: 1.0, s1: 1.06, r: 0 },
        { id: "#s2", beats: 2, origin: "100% 40%", s0: 1.85, s1: 1.95, r: 0 },
        { id: "#s3", beats: 2, origin: "62% 52%", s0: 1.12, s1: 1.2, r: 0 },
        { id: "#s4", beats: 3, origin: "50% 52%", s0: 1.0, s1: 1.08, r: 0 },
        { id: "#s5", beats: 3, origin: "48% 40%", s0: 1.05, s1: 1.12, r: 0 },
        { id: "#s6", beats: 2, origin: "48% 34%", s0: 1.85, s1: 1.95, r: 6 },
        { id: "#s7", beats: 3, origin: "50% 55%", s0: 1.0, s1: 1.07, r: 0 },
        { id: "#s8", beats: 2, origin: "50% 62%", s0: 1.9, s1: 2.0, r: -5 },
        { id: "#s9", beats: 3, origin: "50% 50%", s0: 1.03, s1: 1.1, r: 0 },
        { id: "#s10", beats: 2, origin: "44% 70%", s0: 2.0, s1: 2.1, r: 8 },
        { id: "#s11", beats: 3, origin: "50% 45%", s0: 1.3, s1: 1.36, r: -8 },
      ];
      let t = 0;
      for (const s of SHOTS) {
        const d = s.beats * BEAT;
        tl.fromTo(
          s.id + " .inner",
          { scale: s.s0, rotation: s.r, xPercent: s.x || 0, transformOrigin: s.origin },
          { scale: s.s1, rotation: s.r, xPercent: s.x || 0, transformOrigin: s.origin, duration: d, ease: "none" },
          t,
        );
        t += d;
      }

      // End card on bar 8 (15.27s): drums drop, logo on clean white.
      const END = 28 * BEAT;
      tl.fromTo("#endcard", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, END);
      tl.fromTo("#end-logo", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, END + 0.1);
      tl.fromTo("#end-label", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, END + 0.5);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
